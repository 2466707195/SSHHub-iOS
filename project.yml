# =============================================================================
# SSHHub —— iOS 工程定义（XcodeGen）
# =============================================================================
name: SSHHub
options:
  bundleIdPrefix: com.duyufengkimi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.4"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0
  Crypto:
    url: https://github.com/apple/swift-crypto
    from: 3.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  SSHHub:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SSHHub
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: Crypto
    info:
      path: SSHHub/Resources/Info.plist
      properties:
        CFBundleDisplayName: SSHHub
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duyufengkimi.sshhub
        PRODUCT_NAME: SSHHub
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: SSHHub

schemes:
  SSHHub:
    build:
      targets:
        SSHHub: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
